title: 그리퍼 잡기 · 수집 · 추론
order: 30
group: imitation
desc: Dex1-1 그리퍼 — VR 원격 조작 수집 · 정책 실행
modes:
  - id: collect
    step: collect
    label: VR 수집 시작
    cmd: [start_collect.sh]
    real: true
    gripper: true              # 그리퍼 서비스 · 카메라 숙임 확인은 런처(root)가 함
    open: pick_web:/collect
  - id: pick_sim
    step: collect
    label: 가상 (그리퍼 시뮬)
    cmd: [start_gripper.sh, --sim]
    open: pick_web:/collect
  - id: infer
    step: infer
    label: 추론 시작
    cmd: [start_gripper.sh]
    real: true
    gripper: true
    open: pick_web:/collect
