# 홈 메뉴 (모방학습) — 위에서부터 작업 순서. 박스 핸드오버 · 모션 에디터 실기는 런처에 없음 (각 start 스크립트로 따로)
#   항목: id · title · sub (메뉴 한 줄 설명) · desc (화면 위 설명)
#     native: true  = 런처 화면 (설정)
#     panel: <이름> = 런처의 카드 (수집 · 학습 · 추론 — 저장된 것 고르기 · 올리기 · 시작) 를 먼저 보여 주고, 실행되면 그 화면 (tabs)
#     modes = 필요한 실행 모드 (apps/*/app.yaml modes id, 이 중 하나가 떠 있으면 tabs 화면을 보여 줌)
#     service: true = 런처가 늘 띄워 두는 화면 (시작 버튼 없음)
#     tabs = 보여 줄 화면 (포트이름:경로). 이름 · 로고는 config/local.yaml brand
sections:
  - title: ""
    items:
      - id: settings
        title: 설정
        sub: 로봇 자세 · 모터 확인 · VR
        desc: 로봇 자세 (FSM) · 모터 번호 확인 · VR 설정 · 실행 상태 · 환경
        native: true
        modes: [editor_real]          # 모터 번호 확인 (모션 에디터 실기 — /check)
      - id: sim
        title: 시뮬레이터
        sub: 로봇 없이 3D 로 움직여 보기
        desc: URDF 3D 로봇 — 관절 · IK 로 팔을 움직여 봄 (가짜 로봇, 실기와 섞이지 않음)
        panel: sim
        modes: [editor_virtual]
        tabs: [{title: 시뮬레이터, page: "editor:/"}, {title: 3D, page: "dashboard:/robot-only"}]
      - id: collect
        title: 데이터 수집
        sub: VR 원격 조작 시연 → 데이터셋
        desc: VR 원격 조작으로 시연 에피소드를 모아 데이터셋에 저장 (가상 연습 = 로봇 없이)
        panel: collect
        modes: [collect, pick_sim]
        tabs: [{title: 수집, page: "pick_web:/collect"}]
      - id: train
        title: 학습
        sub: 데이터셋 → lerobot 모델
        desc: LeRobot v3 데이터셋으로 lerobot-train → 모델 (이 PC 의 GPU · 로봇 기능은 끈 상태에서)
        panel: train
        modes: [train_local]
        tabs: [{title: 학습, page: "trainer:/"}]
      - id: infer
        title: 추론
        sub: 모델로 로봇 실행
        desc: 모델로 로봇 실행 · 반복 (가상 = 로봇 없이) — 실기 전 안전 점검 · 오프라인 평가 먼저
        panel: infer
        modes: [infer, pick_sim]
        tabs: [{title: 추론, page: "pick_web:/collect?view=infer"}]     # 추론 전용 보기 (수집 칸 숨김 · 추론 준비 칸)
      - id: viewer
        title: 데이터 보기
        sub: 데이터셋 · 모델 확인
        desc: 데이터셋 (영상 · 관절 · 3D) · 모델 정보 — 이 PC 의 것 · 올린 것 · zip
        service: true
        tabs: [{title: 보기, page: "act_viewer:/"}]
