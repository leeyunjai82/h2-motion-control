# PC 마다 다른 값 — 이 파일을 config/local.yaml 로 복사해서 고침 (local.yaml 은 git 에 안 올림)

# DDS (Unitree SDK) 네트워크 카드. 비우면 CycloneDDS 가 자동 선택 (지금까지와 같음).
#   USB LAN · 공유기 등 유선 카드를 더 꽂으면 자동 선택이 바뀔 수 있음 → 로봇 쪽 카드 이름을 적음 (ip -br addr 로 확인)
#   환경변수 DDS_IFACE 가 있으면 그 값이 우선
dds_interface:

# 홈 (런처) 의 그리퍼 실기 (VR 수집 · 추론): 로봇 쪽 유선 카드 = dds_interface (비우면 enp45s0 — start_gripper.sh 기본값)
# Dex1-1 그리퍼 서비스 실행 파일 (비우면 ~/project/dex1_1_service/bin/dex1_1_gripper_server)
dex1_bin:

# 홈 (런처) 의 '5090 학습 웹' 링크. 비우면 링크를 숨김
trainer_url:

# 홈 화면 이름 · 부제목 (비우면 pitron · Physical AI · 모방학습)
brand:
  name:
  sub:

# lerobot 가상환경 python (apps/trainer/install_lerobot.sh 로 설치) · repo-id 앞부분 (비우면 local)
#   lerobot_python:       수집 v3 변환 · 추론 (CPU torch + OpenVINO) — 비우면 ~/miniconda3/envs/lerobot/bin/python
#   lerobot_train_python: 학습 (XPU · CUDA torch) — 비우면 ~/miniconda3/envs/lerobot_train/bin/python
lerobot_python:
lerobot_train_python:
lerobot_repo_prefix:

# 정책 추론 작업 범위 — 집게 가운데 (pelvis 기준 x y z [m]) 가 이 상자 밖으로 가면 멈춤. 비우면 이 검사 안 함
#   현장 (테이블 · 통 위치) 에 맞게 재서 넣을 것 — 값은 이 로봇 · 현장에서 확인 필요
# policy_tcp_box:
#   left:  {min: [x, y, z], max: [x, y, z]}
#   right: {min: [x, y, z], max: [x, y, z]}
