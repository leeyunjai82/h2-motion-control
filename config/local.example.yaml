# PC 마다 다른 값 — 이 파일을 config/local.yaml 로 복사해서 고침 (local.yaml 은 git 에 안 올림)

# DDS (Unitree SDK) 네트워크 카드. 비우면 CycloneDDS 가 자동 선택 (지금까지와 같음).
#   USB LAN · 공유기 등 유선 카드를 더 꽂으면 자동 선택이 바뀔 수 있음 → 로봇 쪽 카드 이름을 적음 (ip -br addr 로 확인)
#   환경변수 DDS_IFACE 가 있으면 그 값이 우선
dds_interface:

# 홈 (런처) 의 그리퍼 실기 (VR 수집 · 추론): 로봇 쪽 유선 카드 = dds_interface (비우면 enp45s0 — start_gripper.sh 기본값)
# Dex1-1 그리퍼 서비스 실행 파일 (비우면 ~/project/dex1_1_service/bin/dex1_1_gripper_server)
dex1_bin:

# 홈 (런처) 의 '5090 학습 웹' 링크. 비우면 링크를 숨김
trainer_url:

# 홈 화면 이름 · 부제목 (비우면 pitron · Physical AI · 모방학습)
brand:
  name:
  sub:

# LeRobot v3 내보내기 (홈 · 데이터 수집 카드): lerobot 0.4.x 가상환경 python (비우면 ~/miniconda3/envs/lerobot/bin/python) · repo-id 앞부분
lerobot_python:
lerobot_repo_prefix:
