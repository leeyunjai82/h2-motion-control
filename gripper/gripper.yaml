# Dex1-1 그리퍼 설정 — 박스 잡기(robots/h2/robot.yaml · start_robot.sh)와 따로 씀
#   외장 키트: 그리퍼 —485→ 485–USB 보드 → 미니 PC 의 dex1_1_service (-n <유선 인터페이스>) → DDS rt/dex1/{left,right}/{cmd,state}
#   설치 · 보정: INSTALL.md 10단계

# 서비스는 모터 ID 0 → rt/dex1/right, ID 1 → rt/dex1/left 로 내보냄 (dex1_1_service main.cpp, 실행 출력 2026-11-05).
# 이 로봇은 토픽 이름에 맞춰 ID 0 그리퍼를 오른손, ID 1 그리퍼를 왼손에 장착 (사용자 2026-11-05)
#   → 토픽 이름 = 실제 손. 공식 도구(test_dex1_1_gripper_server -l/-r, xr_teleoperate)도 같은 손으로 동작
topics:                       # 실제 손 → 서비스 토픽 이름 앞부분 (/cmd · /state)
  left: rt/dex1/left          # 실제 왼손 = 모터 ID 1
  right: rt/dex1/right        # 실제 오른손 = 모터 ID 0

# q [rad]: 0 = 닫힘 (보정 기준), 클수록 벌어짐. 실측 2026-11-05 (손으로 끝까지 여닫음, gripper/check_dex1.py):
#   ID 0 (오른손) −0.011 ~ 5.248 · ID 1 (왼손) −0.014 ~ 5.166 → 명령 범위 = 0 ~ (작은 쪽 5.166 − 여유 0.1)
q_range: [0.0, 5.05]

# 집게 가운데(TCP) [m, wrist_yaw 관절 기준 x] — 사용자 실측으로 맞춤 (2026-11-09):
#   손목 프레임 앞면 → 손가락 끝 실측 ≈ 147 mm (사용자). Dex1 메시: 원점(앞 몸통 뒷면) → 손가락 끝 143.3, → 집게 패드 가운데 123.0
#   → 손목 앞면 → Dex1 원점 = 147 − 143.3 = 3.7 mm. 손목 앞면 57.7 mm (unitree_ros H2 손 장착 관절 위치)
#   → TCP = 57.7 + 3.7 + 123.0 = 184.4 mm, 손가락 끝 204.7 mm.
#   어댑터: 18 mm 중 4 mm 만 손목 앞면 밖으로 보이고 나머지 14 mm 는 손목 프레임 안에 겹침 (사용자 2026-11-09) → 43.7 ~ 61.7.
#   Dex1 원점 61.4 가 어댑터 끝 61.7 보다 0.3 mm 안쪽 = Dex1 뒷면 돌기 (4.9) 가 어댑터 끝에 겹쳐 들어간 셈 — 실측 오차 수준.
#   TCP 는 실측 147 에만 기대고 (손목 앞면 57.7 + 147 − 손가락 끝 ↔ 패드 가운데 20.3) 어댑터 겹침 해석과는 상관없음.
#   (예전 191.0 은 어댑터가 기본 손 뒤 끝 45.1 에서 시작한다고 본 계산값 — 실측과 6.6 mm 차이)
tcp_offset: [0.1844, 0.0, 0.0]

# 송신 (gripper/dex1_gripper.py) — 아직 로봇에서 안 돌려 봄
kp: 5.0                       # 그리퍼 모터 게인 (xr_teleoperate Dex1 값) — 닫는 힘은 kp × (명령 − 실제), 실제 쥐는 힘 미확인
kd: 0.05
max_vel: 3.0                  # 명령 q 이동 속도 상한 [rad/s] (0.6 rad ≈ 1 cm 이면 약 5 cm/s — q ↔ mm 실측 전)
rate: 200                     # 송신 [Hz] — 끊기면 서비스가 힘을 풂

# 잡기 웹 (gripper/pick_web.py · pick_core.py) — 값은 모두 계산 · 추정, 실물 확인 전
pick:
  mm_per_rad: 15.7            # 집게 안쪽 간격 [mm] = q × 15.7 — 82 mm (URDF 41 mm × 2) / 실측 최대 q 5.2 rad 비율, 캘리퍼 실측 아님
  object_mm: 50               # 잡는 물건 = 50 mm 정육면체 하나로 고정 (2026-11-09). VR 그리퍼 범위 = object + open_margin (벌림) ~ object − squeeze (잡음)
  open_margin_mm: 25          # 벌림 = 박스 + 25 mm (최대 q_range 까지)
  squeeze_mm: 8               # 닫기 목표 = 박스 − 8 mm → kp 로 박스를 밈 (쥐는 힘 미확인)
  contact_min_mm: 3           # 닫은 뒤 간격 ≥ 닫기 목표 + 3 mm 이면 박스에 막힘 = 잡음, 아니면 놓침으로 보고 중단
  # 그리퍼 모양 (TCP 기준, 바닥 거리 · 박스와 겹침 계산) — URDF 메시 · 공식 치수 143 × 78 × 67 mm
  pad_len_half_mm: 20         # 패드 길이 40 mm (손가락 방향, 메시 base x 0.103–0.143) 의 반 — 집게 가운데 = 패드 가운데
  pad_h_half_mm: 14.5         # 패드 높이 29 mm 의 반
  tip_beyond_mm: 20.3         # 손가락 끝 = 집게 가운데 + 20.3 mm (Dex1 메시: 143.3 − 123.0)
  body_back_mm: 54            # 몸통 앞면 = 집게 가운데 − 54 mm (메시 base x 0.069), 몸통 뒷면 = − 123 mm
  body_h_half_mm: 33.5        # 몸통 높이 67 mm 의 반
  min_overlap_mm: 15          # 패드가 박스 옆면과 위아래로 최소 이만큼 겹쳐야 잡음
  tip_clear_mm: 20            # 잡을 때 그리퍼 가장 낮은 점 ↔ 바닥(박스 아랫면) 최소 (2026-11-06 10 → 20: 손이 테이블까지 내려감, 높이 보정 확인 전)
  # 카메라로 잰 점 (테이블 · 박스 · 통) 높이 보정 [m, + = 올림] — 2026-11-06 실기: 그리퍼가 테이블까지 내려감.
  #   테이블 줄자 110 cm ↔ pelvis 1.01 m (10-07 실측) 이면 테이블 pelvis +0.09, 카메라가 잰 값 +0.053 → 3.7 cm 낮게 봄.
  #   카메라 z(0.365) 가 설계값이거나 오늘 pelvis 높이가 달라서일 수 있음 — 접근 위치에서 '테이블 위 mm' 를 자로 재 맞출 것
  #   2026-11-09: 카메라 숙임을 기준(61.8°)에 맞춘 뒤 (차이 −0.35°) 50 mm 큐브를 ≈ 50 mm 위에서 잡음 = 이 +37 mm 가 숙임 3.6° 오차를 메우던 값이라
  #   이제는 남는 것으로 봄 → 0. 접근 단계에서 '테이블 위 mm' 를 자로 재 다시 확인할 것 (낮으면 멈추고 알려 줄 것)
  camera_z_offset_m: 0.0
  transit_clear_mm: 40        # 이동 중 그리퍼 ↔ 바닥 최소
  # 몸통 충돌 검사 (계획 거부) — 팔꿈치 · 손목 · 그리퍼 겉 점이 몸 앞(|y| < body_half_y, z > body_z_min) 에서 x < body_front_x + body_clear 면 거부.
  #   몸통 앞면 x ≈ 0.092–0.097 (torso_link.stl 앞면 표본, robot.yaml 2026-10-16). 2026-11-06 실기: 통을 가슴 앞에 두니 놓을 때 몸통 충돌
  body_front_x: 0.097
  body_half_y: 0.17
  body_z_min: -0.10
  body_clear_m: 0.05
  approach_m: 0.10            # 잡기 전 위치 = 잡는 자리 바로 위 이만큼 (위에서 수직으로 내려감)
  # 준비 자세 = 잡기 시작 · 끝 자세 (왼손 기준, 오른손은 y · roll · yaw 반대) — 카메라 화면 밖
  #   2026-11-05 사용자: 준비 자세 손이 화면을 가림 → (0.20, ±0.30, 0.25)·20° → 팔을 너무 뒤 · 위로 올림 → 아래 값.
  #   오프라인 계산 (카메라 숙임 61.8° calib_local): 양손 그리퍼 · 손목 화면 밖, 박스 x 0.35–0.50 · y 0–±0.30 양손 32 곳 계획 OK,
  #   관절 (오른팔) 어깨 pitch 26 · roll −31 · 팔꿈치 3 (≈ 90° 굽힘) °
  ready_tcp_m: [0.30, 0.35, 0.20]
  # 2026-11-09 pitch 0 → 30: 시연은 로봇 앞에 관람객 (배경이 다름) — 준비 자세에서 손목 카메라가 정면 배경 대신 테이블을 보게 숙임.
  #   오프라인 계산 (카메라 숙임 61.8°): 0~40° 관절 한계 안 · 기본 → 준비 경로 OK (경유 자세), 45° 부터 손목 pitch 한계 (±33°) 걸림.
  #   손목 카메라에 배경이 얼마나 남는지는 실기 화면으로 확인 필요 (더 숙이려면 35~40 까지)
  #   2026-11-09 yaw −15 (왼손 기준 — 오른손은 +15, 좌우 대칭): 양손을 안쪽 (통 · 큐브 쪽) 으로 틂. 계산: 0~−30 관절 한계 안 · 경로 OK
  #   2026-11-09 사용자 "더 아래로 더 안쪽으로" → pitch 40 · yaw −25. 계산: 관절 한계 안 (손목 pitch 13~15° / ±33°), 기본 → 준비 경로 OK
  ready_rpy_deg: [0, 40, -25]
  # 기본 자세 ↔ 준비 자세 경유 자세 — 기본 자세에서 바로 가면 그리퍼가 몸 앞 낮은 곳(z −0.06)을 지나감.
  #   여기를 거치면 몸 앞 0.25 m 넘는 구간에서 그리퍼 가장 낮은 점 z 0.167 (계산), 기본 → 경유는 몸 앞 0.22 m 밖으로 안 나감
  via_tcp_m: [0.20, 0.30, 0.25]
  via_rpy_deg: [0, 20, 0]
  # 손별 집게 가운데 치우침 [m, pelvis] = 실제 − 계산. 목표는 이만큼 빼서 보냄, 화면 점은 더해서 그림
  #   왼손: 실기 2026-11-05 접근 위치(박스 윗면 5 cm 위)에서 집게가 박스 가운데보다 로봇 왼쪽으로 2–3 cm (사용자 육안, 3 회 같음).
  #   같은 카메라로 오른손은 가운데 → 카메라가 아니라 왼팔/왼손 장착 쪽.
  #   앞뒤 x: 2026-11-05 양손 +0.02 (집게가 박스보다 2 cm 앞) 를 넣었다가 2026-11-06 0 으로 — check_rsimu 실측 카메라 숙임
  #   65.4° (저장값 61.8°, 3.6° 차이) 로 0.6 m 앞 점이 약 3.5 cm 앞으로 계산된 것으로 설명됨 → 숙임 다시 저장 후 실기로 다시 확인
  #   z: 2026-11-09 실기 (50 mm 큐브, 준비 자세 40°·25°): 양손 다 계산보다 약 1 cm 낮게 잡음 (사용자 육안) → −0.01 (목표를 1 cm 올려 보냄)
  tcp_bias_m:
    left: [0.0, 0.025, -0.01]
    right: [-0.03, 0.0, -0.01]   # x: 2026-11-09 실기 (원통, 내려가기 단계): 계산(FK 점)은 물체 위인데 실제 집게가 물체보다 약 3 cm 뒤 (사용자 화면)
  lift_m: 0.08                # 들어 올리는 높이
  hold_s: 2.0                 # 든 채로 기다림
  rpy_deg: [0, 20, 0]         # 집게 자세 (pelvis 기준). 0,0,0 = 손이 앞을 봄 · 집게 좌우 (사용자 확인), pitch + = 앞으로 숙임.
                              #   H2 손목 pitch ±33° (URDF) + 집게가 손목에서 19 cm → 위에서 수직(pitch 90)은 거의 못 닿음 (오프라인 IK, 2026-11-05)
  v_lin: 0.08                 # 이동 최고 직선 속도 [m/s]
  v_slow: 0.03                # 내려가기 · 들기 · 내려놓기 [m/s]
  v_joint: 0.4                # 관절 최고 계획 속도 [rad/s]
  server_max_vel: 1.0         # arm_server /stream 관절 속도 상한 [rad/s] (서버 최대 3.0)
  track_abort_deg: 15         # 명령 ↔ 실측 관절 차이가 이보다 크면 그 자리에서 멈춤

# 손목 카메라 (녹화용, gripper/recorder.py) — USB UVC, 640×480 MJPEG 30 fps 요청. 이름: 장치 경로 (꽂는 순서가 바뀌어도 같은
#   /dev/v4l/by-id/… 권장) 또는 번호. 비워 두면(null) 안 씀. 한 데이터셋 안에서는 카메라 구성이 같아야 함 (처음 에피소드가 정함)
#   확인: v4l2-ctl --list-devices · ls -l /dev/v4l/by-id/
#   이 PC (2026-11-09 dmesg): 손목 카메라 2 대가 같은 모델 · **같은 일련번호** (ZVCAI USB_Camera 01da:5875, zvcai231100001)
#   → by-id 이름이 하나만 생기고 마지막에 꽂힌 쪽을 가리킴 (못 씀). 두 대 다 USB 포트 위치 (by-path) 로 지정 — 꽂는 포트를 바꾸지 말 것.
#   USB 포트 1 (3-1) · 포트 2 (3-2). 왼 · 오른 배정은 아직 확인 전 — 웹 손목 카메라 화면에서 렌즈를 가려 보고 바꿀 것
wrist_cam_size: [320, 240]    # 손목 카메라를 이 크기로 열고 그대로 저장 (MJPG 30 fps 지원 — v4l2 2026-11-06). 안 되면 640×480 등 차례로
                              #   320×240 = 전체 화각을 줄인 것 (가운데 자름 아님): 2026-11-09 같은 장면 640×480 축소와 평균 차이 4.2,
                              #   가운데 자른 것과 73.0 (왼손 카메라). 640×480 두 대 동시에도 30 fps 로 열림
wrist_cams:
  wrist_left: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:1:1.0-video-index0
  wrist_right: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:2:1.0-video-index0

# 가상 H2 3D 뷰어 (gripper/xr_viewer.py) — xr_virtual.py (Unitree xr_teleoperate 입력 + H2 IK) 결과를 그림. 로봇 명령 없음.
#   안전 검사 값은 "실제였으면 멈춤" 표시용 (실제 로봇 단계에서 같은 기준을 씀)
xr_view:
  port: 50040
  table_z_m: 0.053            # 테이블 높이 [m, pelvis] — ⚠ 확인 필요: 잡기 웹 테이블 측정값으로 (--table-z, -1.0 = 없음)
  table_x_min_m: 0.15         # 테이블 앞 끝 [m, pelvis x] — 이보다 앞에 있는 그리퍼만 테이블 높이 검사. ⚠ 실제 테이블 위치로 맞출 것
  arm_gap_m: 0.12             # 양팔 (팔꿈치 · 손목 · 집게 가운데) 사이 최소 거리
  back_limit_m: -0.12         # 팔꿈치 · 손목 · 그리퍼가 pelvis 기준 이보다 뒤 (x) 면 멈춤 — 로봇 뒤 물건 보호. ⚠ 실제 뒤 공간에 맞출 것
  timeout_s: 0.5              # 이 시간 동안 값이 안 오면 '입력 끊김'
  hand_offset_m: [-0.15, 0.05, 0.10]   # VR: 로봇 손 목표 = 사람 손 (xr_teleoperate) + 이 값 [m, 앞 · 바깥 · 위] (바깥 = 왼손 +y · 오른손 −y)
                              #   2026-11-10 앞 −0.15 (로봇 손이 사람 손보다 앞 — xr_teleoperate 머리 → 허리 이동 앞 +0.15)
                              #   2026-11-10 실기: 로봇 손이 사람 손보다 아래 · 몸통 안쪽 → 위 +0.10 · 바깥 +0.05 (시작값, 실기로 맞출 것)
  real_max_vel: 0.3           # VR 실기 (gripper/xr_real.py, 잡기 웹 [VR 시작]) arm_server 스트림 관절 속도 기본 [rad/s] (웹에서 0.2/0.3/0.5, 상한 1.0)
  dex1_view:                  # 3D 보기 그리퍼 모양 (gripper/dex1_1, Unitree 공식 URDF) — 표시만, IK · 안전 검사는 위 tcp_offset · ENVELOPE 를 씀
    urdf: dex1_1/dex1_1.urdf
    origin_to_tcp_m: 0.123    # Dex1 원점 → 집게 패드 가운데 (tcp_offset 주석과 같음, 메시 손가락 끝 143.3 mm 와 맞음) → 원점 = 손목 기준 0.1844 − 0.123 = 0.0614
    mount_rpy_deg: [0, 0, 0]  # 손목(wrist_yaw) 기준 Dex1 방향. 0 = 집게가 좌우 (사용자 확인). ⚠ 뒤집혀 달렸는지(roll 180) 는 확인 필요 — 모양만 다름
    wrist_face_m: 0.0577      # 손목 프레임 앞면 (손목 기준 x) — H2 손목 메시에 붙은 기본 손은 여기서 앞쪽을 안 그림
    adapter_m: [0.0437, 0.0617, 0.039]   # 손목 기준 x 시작 · 끝 · 지름 (앞 4 mm 만 손목 밖 — tcp_offset 주석) — 어댑터 STL 이 없을 때 원통으로 그림
    adapter_stl:              # 사용자 어댑터 STL (2026-11-05 받은 파일, mm, 42 × 57 × 두께 18 — 두께 방향 = 원본 z)
      path: adapter/adapter.stl   # gripper/adapter/adapter.stl (사용자 설계, 저장소에 포함 — 2026-11-09 사용자 요청)
      scale: 0.001                # mm → m
      origin_mm: [-45.004, 73.478, 1.0]    # 원본에서 42 × 57 판 쪽 면 가운데 — 손목 앞 at_m 에 놓임 (사용자 2026-11-08: 판 쪽이 손목, Ø39 쪽이 Dex1)
      at_m: [0.0437, 0.0, 0.0]             # 손목 wrist_yaw 기준 그 점 위치 = 손목 앞면 57.7 + 보이는 4 − 18
      rot: [[0, 0, 1], [0, 1, 0], [-1, 0, 0]]   # 원본 → 손목 축: 손목 x = 원본 z (판 z 1 → Ø39 z 19), y = 원본 y (57 mm), z = −원본 x (42 mm)
