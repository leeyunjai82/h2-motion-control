# Dex1-1 그리퍼 설정 — 박스 잡기(robots/h2/robot.yaml · start_robot.sh)와 따로 씀
#   외장 키트: 그리퍼 —485→ 485–USB 보드 → 미니 PC 의 dex1_1_service (-n <유선 인터페이스>) → DDS rt/dex1/{left,right}/{cmd,state}
#   설치 · 보정: INSTALL.md 10단계

# 서비스는 모터 ID 0 → rt/dex1/right, ID 1 → rt/dex1/left 로 내보냄 (dex1_1_service main.cpp, 실행 출력 2026-11-05).
# 이 로봇은 ID 0 그리퍼를 왼손, ID 1 그리퍼를 오른손에 장착 (사용자 2026-11-05) → 토픽 이름과 실제 손이 반대.
#   공식 도구(test_dex1_1_gripper_server -l/-r, xr_teleoperate)도 좌우가 반대로 동작함
topics:                       # 실제 손 → 서비스 토픽 이름 앞부분 (/cmd · /state)
  left: rt/dex1/right         # 실제 왼손 = 모터 ID 0
  right: rt/dex1/left         # 실제 오른손 = 모터 ID 1

# q [rad]: 0 = 닫힘 (보정 기준), 클수록 벌어짐. 실측 2026-11-05 (손으로 끝까지 여닫음, gripper/check_dex1.py):
#   왼손(ID 0) −0.011 ~ 5.248 · 오른손(ID 1) −0.014 ~ 5.166 → 명령 범위 = 0 ~ (작은 쪽 5.166 − 여유 0.1)
q_range: [0.0, 5.05]

# 집게 가운데(TCP) [m, wrist_yaw 관절 기준 x] — 계산값 (2026-11-05), 실측 전:
#   기본 손 뒤 끝 45.1 mm (unitree_ros H2 left_hand_link 메시) + 사용자 어댑터 18.0 (Ø39 쪽이 기본 손 자리에 끼워짐)
#   + Dex1 뒷면 돌기 4.9 + Dex1 원점 → 집게 패드 가운데 123.0 = 191.0 mm, 손가락 끝 211.3 mm.
#   확인 방법: 손목 받침 앞 끝 → 손가락 끝 실측 ≈ 153.6 mm. 팔 IK(robot.yaml ik.ee_offset 0.05)는 바꾸지 않음 —
#   집기 동작을 만들 때 이 값으로 집게 목표를 손 기준점 목표로 바꿔 arm_server 에 보냄
tcp_offset: [0.191, 0.0, 0.0]

# 송신 (gripper/dex1_gripper.py) — 아직 로봇에서 안 돌려 봄
kp: 5.0                       # 그리퍼 모터 게인 (xr_teleoperate Dex1 값) — 닫는 힘은 kp × (명령 − 실제), 실제 쥐는 힘 미확인
kd: 0.05
max_vel: 3.0                  # 명령 q 이동 속도 상한 [rad/s] (0.6 rad ≈ 1 cm 이면 약 5 cm/s — q ↔ mm 실측 전)
rate: 200                     # 송신 [Hz] — 끊기면 서비스가 힘을 풂
