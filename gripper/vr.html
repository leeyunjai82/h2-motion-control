<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2 VR 조작 (읽기 전용)</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; margin: 16px; }
  button { font-size: 22px; padding: 14px 24px; margin: 6px 6px 6px 0; border-radius: 8px; border: 0; background: #2a6; color: #fff; }
  button:disabled { background: #555; }
  .box { background: #222; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 18px; line-height: 1.6; }
  .ok { color: #6d6; } .warn { color: #fc4; } .stop { color: #f66; } .idle { color: #aaa; }
</style>
</head>
<body>
<h2>H2 VR 조작 — 1단계 읽기 전용 (로봇은 안 움직임)</h2>
<button id="go" disabled>VR 시작</button>
<div class="box" id="info">WebXR 확인 중…</div>
<div class="box">
  그립(중지) 버튼 누르고 있는 동안만 따라감 · 트리거 = 그리퍼 닫기 · A/X = 그리퍼 닫힘 고정 · B/Y = 자세 맞춤 (가상 로봇처럼 팔을 내리고 누름)<br>
  컨트롤러 옆 작은 상자 색: 초록 따라감 · 노랑 일부만 · 빨강 멈춤 (진동) · 회색 대기
</div>
<div class="box" id="st">연결 전</div>
<canvas id="cv" style="display:none"></canvas>
<script>
"use strict";
const $ = id => document.getElementById(id);
let ws = null, wsOk = false, lastAck = null, rtt = null, sendT = 0, recenterReq = false, recenterQ = null;
const level = { left: "idle", right: "idle" };
const prevBtn = { left: false, right: false };
const prevA = { left: false, right: false }, toggleReq = { left: false, right: false };

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { wsOk = true; };
  ws.onclose = () => { wsOk = false; setTimeout(connect, 1000); };
  ws.onerror = () => {};
  ws.onmessage = ev => {
    const a = JSON.parse(ev.data);
    if (a.t != null) rtt = performance.now() - a.t;
    lastAck = a;
    Object.assign(level, a.level || {});
  };
}
connect();

setInterval(() => {
  $("st").innerHTML = `서버 ${wsOk ? '<span class="ok">연결됨</span>' : '<span class="stop">끊김</span>'}`
    + ` · 왕복 ${rtt == null ? "-" : rtt.toFixed(0) + " ms"}`
    + ` · 오른손 <span class="${level.right}">${level.right}</span> · 왼손 <span class="${level.left}">${level.left}</span>`;
}, 300);

// ---------- 작은 상자 그리기 (WebGL) ----------
let gl = null, prog = null, buf = null, uMvp = null, uCol = null;
function initGL(canvas) {
  gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });
  const vs = "attribute vec3 p; uniform mat4 mvp; void main(){ gl_Position = mvp * vec4(p, 1.0); }";
  const fs = "precision mediump float; uniform vec4 col; void main(){ gl_FragColor = col; }";
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  const s = 0.015, v = [];
  const c = [[-s,-s,-s],[s,-s,-s],[s,s,-s],[-s,s,-s],[-s,-s,s],[s,-s,s],[s,s,s],[-s,s,s]];
  const f = [[0,1,2,0,2,3],[4,6,5,4,7,6],[0,4,5,0,5,1],[3,2,6,3,6,7],[0,3,7,0,7,4],[1,5,6,1,6,2]];
  f.forEach(t => t.forEach(i => v.push(...c[i])));
  buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(v), gl.STATIC_DRAW);
  uMvp = gl.getUniformLocation(prog, "mvp"); uCol = gl.getUniformLocation(prog, "col");
}
function mul(a, b) {   // 4x4 열 우선
  const o = new Float32Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s;
  }
  return o;
}
const COL = { ok: [0.2, 0.9, 0.3, 0.9], warn: [1.0, 0.8, 0.2, 0.9], stop: [1.0, 0.25, 0.25, 0.9], idle: [0.6, 0.6, 0.6, 0.7] };

function haptic(src, v) {
  if (!v || !src.gamepad) return;
  try {
    const h = src.gamepad.hapticActuators && src.gamepad.hapticActuators[0];
    if (h && h.pulse) { h.pulse(v, 40); return; }
    const va = src.gamepad.vibrationActuator;
    if (va && va.playEffect) va.playEffect("dual-rumble", { duration: 40, strongMagnitude: v, weakMagnitude: v });
  } catch (e) {}
}

// ---------- XR ----------
async function start() {
  let mode = null;
  if (await navigator.xr.isSessionSupported("immersive-ar")) mode = "immersive-ar";
  else if (await navigator.xr.isSessionSupported("immersive-vr")) mode = "immersive-vr";
  if (!mode) { $("info").textContent = "immersive-ar / vr 둘 다 지원 안 됨"; return; }
  const session = await navigator.xr.requestSession(mode, { requiredFeatures: ["local-floor"] });
  const canvas = $("cv");
  initGL(canvas);
  await gl.makeXRCompatible();
  session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
  const ref = await session.requestReferenceSpace("local-floor");
  $("info").textContent = `${mode} 실행 중`;
  session.addEventListener("end", () => { $("info").textContent = "VR 끝남 — 다시 시작하려면 버튼"; });
  const onFrame = (t, frame) => {
    session.requestAnimationFrame(onFrame);
    const layer = session.renderState.baseLayer;
    gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
    gl.clearColor(0, 0, 0, mode === "immersive-ar" ? 0 : 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const vp = frame.getViewerPose(ref);
    const msg = { t: performance.now(), rtt: rtt, recenter: false, head: null, hands: {} };
    if (vp) {
      const o = vp.transform.orientation, p = vp.transform.position;
      msg.head = { p: [p.x, p.y, p.z], q: [o.x, o.y, o.z, o.w] };
    }
    const draws = [];
    for (const src of session.inputSources) {
      if (!src.gripSpace || !src.gamepad || (src.handedness !== "left" && src.handedness !== "right")) continue;
      const pose = frame.getPose(src.gripSpace, ref);
      if (!pose) continue;
      const o = pose.transform.orientation, p = pose.transform.position, b = src.gamepad.buttons;
      const by = !!(b[5] && b[5].pressed);
      if (by && !prevBtn[src.handedness]) {
        recenterReq = true;
        const ap = src.targetRaySpace && frame.getPose(src.targetRaySpace, ref);   // 컨트롤러가 가리키는 방향 = 로봇 앞
        if (ap) { const q = ap.transform.orientation; recenterQ = [q.x, q.y, q.z, q.w]; }
      }
      prevBtn[src.handedness] = by;
      const ax4 = !!(b[4] && b[4].pressed);
      if (ax4 && !prevA[src.handedness]) toggleReq[src.handedness] = true;   // A/X = 그리퍼 닫힘 고정 켜고 끔
      prevA[src.handedness] = ax4;
      msg.hands[src.handedness] = {
        p: [p.x, p.y, p.z], q: [o.x, o.y, o.z, o.w],
        trig: b[0] ? b[0].value : 0, grip: b[1] ? b[1].value : 0,
      };
      draws.push([pose.transform.matrix, COL[level[src.handedness]] || COL.idle]);
      if (lastAck && lastAck.haptic) haptic(src, lastAck.haptic[src.handedness]);
    }
    if (lastAck) lastAck.haptic = null;
    if (wsOk && t - sendT >= 18) {          // 약 50 Hz
      if (recenterReq) { msg.recenter = true; msg.recenter_q = recenterQ; recenterReq = false; recenterQ = null; }
      for (const s of ["left", "right"]) if (toggleReq[s] && msg.hands[s]) { msg.hands[s].toggle = true; toggleReq[s] = false; }
      ws.send(JSON.stringify(msg));
      sendT = t;
    }
    if (vp) {
      gl.useProgram(prog); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
      gl.enable(gl.DEPTH_TEST);
      for (const view of vp.views) {
        const v = layer.getViewport(view);
        gl.viewport(v.x, v.y, v.width, v.height);
        const pv = mul(view.projectionMatrix, view.transform.inverse.matrix);
        for (const [m, col] of draws) {
          gl.uniformMatrix4fv(uMvp, false, mul(pv, m));
          gl.uniform4fv(uCol, col);
          gl.drawArrays(gl.TRIANGLES, 0, 36);
        }
      }
    }
  };
  session.requestAnimationFrame(onFrame);
}

if (!navigator.xr) {
  $("info").innerHTML = '<span class="stop">WebXR 없음</span> — Quest 브라우저에서 http://localhost (adb reverse) 또는 HTTPS 로 열 것';
} else {
  Promise.all([navigator.xr.isSessionSupported("immersive-ar"), navigator.xr.isSessionSupported("immersive-vr")]).then(([ar, vr]) => {
    $("info").textContent = `immersive-ar ${ar ? "가능" : "불가"} · immersive-vr ${vr ? "가능" : "불가"}`;
    $("go").disabled = !(ar || vr);
  });
  $("go").onclick = () => start().catch(e => { $("info").textContent = "시작 실패: " + e; });
}
</script>
</body>
</html>
