<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2 VR 모니터</title>
<style>
  body { font-family: sans-serif; background: #f4f4f4; color: #222; margin: 16px; }
  h2 { margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px #0002; }
  .hand { min-width: 340px; flex: 1; }
  .ok { color: #1a8a2a; } .warn { color: #b77800; } .stop { color: #c62828; } .idle { color: #777; }
  .big { font-size: 22px; font-weight: bold; }
  table { border-collapse: collapse; font-size: 13px; }
  td { padding: 1px 6px; }
  .bar { position: relative; width: 140px; height: 10px; background: #ddd; border-radius: 3px; }
  .bar i { position: absolute; top: -2px; width: 3px; height: 14px; background: #333; }
  .bar.near i { background: #c62828; }
  canvas { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px #0002; max-width: 100%; }
  button { font-size: 15px; padding: 6px 14px; }
  .ro { background: #fff3cd; padding: 6px 10px; border-radius: 6px; display: inline-block; }
</style>
</head>
<body>
<h2>H2 VR 모니터 <span class="ro">1단계 읽기 전용 — 로봇에 명령 안 보냄</span></h2>
<div id="top" class="card" style="margin-bottom:12px">연결 중…</div>
<div class="row">
  <div class="card hand" id="h_right"></div>
  <div class="card hand" id="h_left"></div>
</div>
<div class="row" style="margin-top:12px">
  <div><div>위에서 (위 = 로봇 앞 x, 왼쪽 = 로봇 왼쪽 y)</div><canvas id="cTop" width="420" height="420"></canvas></div>
  <div><div>옆에서 (오른쪽 = 앞 x, 위 = z) · 갈색 선 = 테이블</div><canvas id="cSide" width="420" height="420"></canvas></div>
</div>
<p><button onclick="fetch('/api/reset',{method:'POST'})">가상 팔 준비 자세로 리셋</button></p>
<script>
"use strict";
const $ = id => document.getElementById(id);
const NAME = { right: "오른손", left: "왼손" };
const ARMCOL = { right: "#1565c0", left: "#ad1457" };

function handHtml(side, h) {
  const v = (x, u) => x == null ? "-" : x + (u || "");
  let s = `<div class="big ${h.level}">${NAME[side]} · ${h.state}</div>`;
  s += `<div class="${h.level}">${h.reason || "&nbsp;"}</div>`;
  s += `<table>`;
  s += `<tr><td>목표 TCP</td><td>${v(h.target && h.target.join(", "))}</td><td>RPY ${v(h.target_rpy && h.target_rpy.join(", "))}</td></tr>`;
  s += `<tr><td>가상 TCP</td><td>${h.tcp.join(", ")}</td><td>RPY ${h.tcp_rpy.join(", ")}</td></tr>`;
  s += `<tr><td>오차</td><td>${v(h.err_mm, " mm")}</td><td>${v(h.err_deg, "°")}</td></tr>`;
  s += `<tr><td>몸통</td><td>${v(h.body_gap_cm, " cm")}</td><td>테이블 위 ${v(h.table_mm, " mm")} · 다른 팔 ${v(h.arm_gap_cm, " cm")}</td></tr>`;
  s += `<tr><td>그리퍼</td><td>${h.gripper_mm} mm</td><td>${h.engaged ? "그립 중" : ""}</td></tr>`;
  s += `</table><table style="margin-top:6px">`;
  for (const j of h.joints) {
    const f = Math.min(1, Math.max(0, (j.deg - j.lo) / (j.hi - j.lo)));
    s += `<tr><td>${j.name}</td><td style="text-align:right">${j.deg}°</td>`
       + `<td><div class="bar ${j.near ? "near" : ""}"><i style="left:${(f * 137).toFixed(0)}px"></i></div></td>`
       + `<td style="color:#888">${j.lo} ~ ${j.hi}</td></tr>`;
  }
  return s + `</table>`;
}

function draw(st) {
  const S = 420, k = 420 / 1.4;     // 1.4 m 를 캔버스에
  // 위에서: 화면 위 = +x, 화면 왼쪽 = +y. 원점 (pelvis) = 아래쪽 가운데
  const T = (p) => [S / 2 - p[1] * k, S - 40 - p[0] * k];
  // 옆에서: 화면 오른쪽 = +x, 위 = +z. 원점 = 왼쪽 가운데 조금 위
  const Sd = (p) => [60 + p[0] * k, S / 2 + 40 - p[2] * k];
  for (const [id, F, side] of [["cTop", T, true], ["cSide", Sd, false]]) {
    const c = $(id).getContext("2d");
    c.clearRect(0, 0, S, S);
    const b = st.body;
    c.fillStyle = "#e0e0e0";
    if (side) {
      const a = F([b.front_x, b.half_y]), z = F([-0.12, -b.half_y]);
      c.fillRect(a[0], a[1], z[0] - a[0], z[1] - a[1]);
    } else {
      const a = F([-0.12, 0, 0.45]), z = F([b.front_x, 0, b.z_min]);
      c.fillRect(a[0], a[1], z[0] - a[0], z[1] - a[1]);
      c.strokeStyle = "#8d6e63"; c.lineWidth = 2;
      const t0 = F([0.15, 0, st.table_z]), t1 = F([1.2, 0, st.table_z]);
      c.beginPath(); c.moveTo(t0[0], t0[1]); c.lineTo(t1[0], t1[1]); c.stroke();
    }
    for (const s of ["right", "left"]) {
      const h = st.hands[s];
      c.strokeStyle = ARMCOL[s]; c.lineWidth = 3; c.beginPath();
      h.pts.forEach((p, i) => { const q = F(p); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); });
      c.stroke();
      const e = F(h.tcp);
      c.fillStyle = ARMCOL[s]; c.beginPath(); c.arc(e[0], e[1], 5, 0, 7); c.fill();
      if (h.target) {
        const g = F(h.target);
        c.strokeStyle = h.level === "stop" ? "#c62828" : "#2e7d32"; c.lineWidth = 2;
        c.beginPath(); c.arc(g[0], g[1], 8, 0, 7); c.stroke();
      }
    }
  }
}

async function tick() {
  try {
    const st = await (await fetch("/api/state")).json();
    $("top").innerHTML = `Quest ${st.age_s == null ? '<span class="stop">아직 연결 안 됨</span>'
        : (st.age_s < 0.5 ? '<span class="ok">수신 중</span>' : `<span class="stop">${st.age_s} 초 전 마지막</span>`)}`
      + ` · ${st.rate_hz} Hz · 왕복 ${st.rtt_ms == null ? "-" : st.rtt_ms.toFixed(0) + " ms"}`
      + ` · 방향 ${st.heading_deg}° · 배율 ${st.scale} · 목표 속도 상한 ${st.v_max} m/s · 테이블 z ${st.table_z}`;
    for (const s of ["right", "left"]) $("h_" + s).innerHTML = handHtml(s, st.hands[s]);
    draw(st);
  } catch (e) {
    $("top").innerHTML = '<span class="stop">서버 응답 없음</span>';
  }
  setTimeout(tick, 100);
}
tick();
</script>
</body>
</html>
